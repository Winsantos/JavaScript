<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        h1{
            padding-left: 20px;
        }

        span::before {
            content: "";
            background-color: red;
            width: 15px;
            height: 2px;
            border: 2px solid red;
            position: absolute;
            top: 40px;
            left: 5px;

            
        }
        span::after{
            content: "";
            background-color: green;
            width: 15px;
            height: 2px;
            border: 2px solid red;
            position: absolute;
            top: 40px;
            left: 5px;
        }
    </style>
</head>
<body>
    <h1>Título Principal</h1>
</body>
</html>
